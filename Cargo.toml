[package]
name = "backlog-panda"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Application minimale de gestion de backlog de jeux vidéo, modélisée à partir du comportement observé de Backloggd"

[lib]
name = "backlog_panda"
path = "src/lib.rs"

[[bin]]
name = "backlog-panda"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
keyring = { version = "3.6", default-features = false }

# Coffre natif : Gestionnaire d'identifiants (Windows) ou Trousseau (macOS). Ailleurs, aucun coffre : repli sur le fichier.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
