# Fabrique « Backlog Panda.exe » et le publie dans une release quand on pousse une étiquette (ex. v0.2.0).
# Non testé : écrit sans pouvoir l'exécuter ; à surveiller lors du premier essai.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --locked
      - name: Compilation
        working-directory: src-tauri
        run: cargo build --release --locked
      - name: Préparation du fichier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item 'src-tauri/target/release/backlog-panda-app.exe' 'dist/Backlog Panda.exe'
          $h = (Get-FileHash 'dist/Backlog Panda.exe' -Algorithm SHA256).Hash.ToLower()
          "SHA-256 : $h" | Out-File dist/notes.txt -Encoding utf8
          "Empreinte : $h"
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" 'dist/Backlog Panda.exe' --title "Backlog Panda ${{ github.ref_name }}" --notes-file dist/notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Backlog-Panda
          path: dist/Backlog Panda.exe
